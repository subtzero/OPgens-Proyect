# ==============================
#        OPGens - Config
# ==============================

# Prefijo del plugin en mensajes
prefix: "&8[&aOPGens&8]&r"

# Limite de generadores por jugador (0 = sin limite)
max-gens-per-player: 10

# Intervalo en ticks entre cada drop del generador (20 ticks = 1 segundo)
gen-tick-interval: 40

# ==============================
#     GENERADORES (en orden)
# ==============================
# Cada gen tiene:
#   display-name: nombre con colores
#   tier: numero de tier (orden de upgrade)
#   block: bloque visual del generador
#   drop-material: item que suelta (si es PLAYER_HEAD usa cabeza custom)
#   drop-is-head: true si suelta cabeza
#   head-texture: texture base64 si drop-is-head es true
#   shop-price: precio para comprar en /genshop (solo tier 1)
#   upgrade-price: precio para mejorar al siguiente tier
#   sell-price: precio de venta del drop con /sell
#   purchasable: true solo para el tier 1

generators:
  wheat_t1:
    display-name: "&eGenerador de Trigo &7[T1]"
    tier: 1
    block: WHEAT
    drop-material: WHEAT
    drop-is-head: false
    shop-price: 500
    upgrade-price: 1500
    sell-price: 5.0
    purchasable: true

